# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties (26.x uses official Mojang mappings, yarn is discontinued past 1.21.11)
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.21

# Mod Properties
mod_version=1.1.0
maven_group=xkzuto.armordamagetint
archives_base_name=armordamagetint

# Supported Minecraft versions (one jar covers the whole range)
publish_target_min=26.1
publish_target_max=26.3

# Dependencies
fabric_version=0.160.0+26.2
cloth_config_version=26.2.155
modmenu_version=20.0.2
